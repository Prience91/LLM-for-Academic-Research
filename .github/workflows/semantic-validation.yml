name: Semantic validation regression
on: [push, pull_request]
jobs:
  semantic-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner only
        run: python -m pip install 'pytest>=8,<10'
      - name: Run synthetic semantic-validation regression suite
        run: >-
          python -B -m pytest -q -p no:cacheprovider
          tests/test_obligation_retrieval.py
          tests/test_semantic_validation_failure.py
          tests/test_generation_citation_policy.py
