brief_summary_max_tokens = 550
brief_summary_max_chunks = 8
minimum_citation_coverage = 0.80
no_evidence_message = "No corpus evidence."
validation_failure_message = "The generated response could not be released because it failed grounding validation."
summary_validation_failure_message = "The generated source summary was incomplete and could not be released."

[serving]
